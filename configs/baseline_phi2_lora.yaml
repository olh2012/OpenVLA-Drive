model:
  name: "VLADrivingPolicy"

  backbone:
    model_name: "microsoft/phi-2"
    vision_model_name: "openai/clip-vit-base-patch32"
    freeze_vision_tower: true
    freeze_llm: true

  lora:
    use_lora: true
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules:
      - "q_proj"
      - "v_proj"
      - "k_proj"
      - "o_proj"
    bias: "none"

  action_head:
    num_timesteps: 10
    hidden_dim: 512
    num_layers: 3
    dropout: 0.1

training:
  batch_size: 8
  learning_rate: 2.0e-4
  max_epochs: 30
